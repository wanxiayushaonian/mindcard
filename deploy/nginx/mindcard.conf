# MindCard — Nginx 反向代理配置
# 部署到 /etc/nginx/conf.d/mindcard.conf（或 sites-available + symlink）
#
# 拓扑:
#   mindcard.online    → 127.0.0.1:3000  (Next.js standalone 容器)
#   api.mindcard.online→ 127.0.0.1:8000  (FastAPI uvicorn 容器, 含 /api/ws WebSocket)
#
# HTTPS 由 certbot 自动注入（见 deploy/README.md），本文件只含 HTTP 入口。

# WebSocket 连接头映射（必须在 http 上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── API 后端（REST + SSE + WebSocket）────────────────────
server {
    listen 80;
    server_name api.mindcard.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式 / LLM 长响应
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Web 前端 ─────────────────────────────────────────────
server {
    listen 80;
    server_name mindcard.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
