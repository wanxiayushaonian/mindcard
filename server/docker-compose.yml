services:
  postgres:
    container_name: mindcard-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindcard}
      POSTGRES_DB: ${POSTGRES_DB:-mindcard}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: mindcard-redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: mindcard-app
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindcard}:${POSTGRES_PASSWORD:-mindcard}@postgres:5432/${POSTGRES_DB:-mindcard}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
