services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindcard}
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  app:
    image: mindcard-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindcard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-mindcard}
      REDIS_URL: redis://redis:6379/0
    volumes: !override []
    command: !override uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
